<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wojtek Bot - Multi-Account Cluster Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --primary: #238636;
      --primary-hover: #2ea043;
      --danger: #da3633;
      --blue: #58a6ff;
      --accent: #1f6feb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 30px 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 26px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .metric-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .metric-value {
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      margin-top: 8px;
    }

    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1.6fr;
      gap: 20px;
    }

    @media (max-width: 850px) {
      .main-grid { grid-template-columns: 1fr; }
    }

    h2 {
      font-size: 18px;
      color: #fff;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 10px 14px;
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--blue);
    }

    button {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    button:hover {
      background: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-ONLINE { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid rgba(35, 134, 54, 0.4); }
    .status-CONNECTING { background: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.4); }
    .status-RECONNECTING { background: rgba(210, 153, 34, 0.2); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.4); }
    .status-CHECKPOINT { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid rgba(218, 54, 51, 0.4); }
    .status-ERROR { background: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid rgba(218, 54, 51, 0.4); }
    .status-IDLE { background: rgba(139, 148, 158, 0.2); color: #8b949e; border: 1px solid rgba(139, 148, 158, 0.4); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 12px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: var(--text-muted);
      font-weight: 600;
      background: rgba(255, 255, 255, 0.02);
    }

    #alert-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
      line-height: 1.4;
    }

    .alert-success { background: rgba(35, 134, 54, 0.2); border: 1px solid #238636; color: #3fb950; }
    .alert-error { background: rgba(218, 54, 51, 0.2); border: 1px solid #da3633; color: #f85149; }
    .alert-info { background: rgba(88, 166, 255, 0.2); border: 1px solid #58a6ff; color: #58a6ff; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🤖 Wojtek Bot &mdash; Panel Multi-Account</h1>
      <span id="system-time" style="color: var(--text-muted); font-size: 14px;"></span>
    </header>

    <!-- KARTY STATYSTYK -->
    <div class="metrics-grid">
      <div class="card">
        <div class="metric-title">Podłączone Konta</div>
        <div class="metric-value" id="val-active-bots">0</div>
      </div>
      <div class="card">
        <div class="metric-title">Wczytane Komendy</div>
        <div class="metric-value" id="val-total-cmds">0</div>
      </div>
      <div class="card">
        <div class="metric-title">Zużycie Pamięci RAM</div>
        <div class="metric-value" id="val-memory-rss">0 MB</div>
      </div>
      <div class="card">
        <div class="metric-title">Tryb Bazy Danych</div>
        <div class="metric-value" style="font-size: 20px; color: #3fb950;">Zero-Setup (Aktywny)</div>
      </div>
    </div>

    <!-- SEKCJA GŁÓWNA -->
    <div class="main-grid">
      <!-- FORMULARZ DODAWANIA KONTA -->
      <div class="card">
        <h2>➕ Dodaj Nowe Konto Bota</h2>
        <form id="add-account-form">
          <div class="form-group">
            <label for="email">E-mail lub Telefon Facebook:</label>
            <input type="text" id="email" required placeholder="np. jan.kowalski@gmail.com">
          </div>

          <div class="form-group">
            <label for="password">Hasło do Facebooka:</label>
            <input type="password" id="password" required placeholder="Hasło...">
          </div>

          <div class="form-group">
            <label for="totp">Klucz konfiguracji 2FA (Secret Key):</label>
            <input type="text" id="totp" placeholder="np. JBSWY3DPEHPK3PXP (z Authenticatora)">
          </div>

          <div class="form-group">
            <label for="proxy">Proxy HTTP/SOCKS5 (Opcjonalnie):</label>
            <input type="text" id="proxy" placeholder="np. http://user:pass@1.2.3.4:8080">
          </div>

          <button type="submit" id="btn-submit">
            <span>🚀 Zaloguj i Uruchom Bota</span>
          </button>

          <div id="alert-box"></div>
        </form>
      </div>

      <!-- TABELA AKTYWNYCH KONT -->
      <div class="card">
        <h2>📋 Lista Kont w Klastrze</h2>
        <div style="overflow-x: auto;">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>E-mail</th>
                <th>Status</th>
                <th>Proxy</th>
                <th>Próby</th>
              </tr>
            </thead>
            <tbody id="accounts-table-body">
              <tr>
                <td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">
                  Brak zarejestrowanych kont. Dodaj pierwsze konto w formularzu po lewej!
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    function updateClock() {
      document.getElementById('system-time').textContent = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();

    async function fetchStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        // Liczniki
        const activeCount = (data.activeBots || []).filter(b => b.status === 'ONLINE').length;
        document.getElementById('val-active-bots').textContent = `${activeCount} / ${(data.activeBots || []).length}`;
        document.getElementById('val-total-cmds').textContent = data.totalCommandsLoaded || 0;

        if (data.memoryUsage) {
          const rssMb = Math.round(data.memoryUsage.rss / (1024 * 1024));
          document.getElementById('val-memory-rss').textContent = `${rssMb} MB`;
        }

        // Tabela
        const tbody = document.getElementById('accounts-table-body');
        if (!data.activeBots || data.activeBots.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 30px;">Brak zarejestrowanych kont. Dodaj pierwsze konto w formularzu po lewej!</td></tr>`;
          return;
        }

        tbody.innerHTML = data.activeBots.map(b => `
          <tr>
            <td>#${b.id}</td>
            <td style="font-weight: 500; color: #fff;">${b.email}</td>
            <td><span class="status-badge status-${b.status}">${b.status}</span></td>
            <td>${b.hasProxy ? '✅ Tak' : '❌ Bezpośrednie'}</td>
            <td>${b.retries || 0}</td>
          </tr>
        `).join('');
      } catch (e) {
        console.error('Blad odswiezania statusu:', e);
      }
    }

    setInterval(fetchStatus, 4000);
    fetchStatus();

    // Obsluga formularza
    const form = document.getElementById('add-account-form');
    const alertBox = document.getElementById('alert-box');
    const btnSubmit = document.getElementById('btn-submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'block';
      alertBox.className = 'alert-info';
      alertBox.innerHTML = '⏳ Trwa automatyczne logowanie Puppeteerem i generowanie 2FA... Może to potrwać 10-25 sekund.';
      btnSubmit.disabled = true;

      const payload = {
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        totpSecret: document.getElementById('totp').value.trim() || undefined,
        proxyUrl: document.getElementById('proxy').value.trim() || undefined
      };

      try {
        const res = await fetch('/api/accounts/add', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (!res.ok || json.error) {
          throw new Error(json.error || 'Nieznany błąd logowania.');
        }

        alertBox.className = 'alert-success';
        alertBox.innerHTML = `✅ <b>Sukces!</b> ${json.message}`;
        form.reset();
        fetchStatus();
      } catch (err) {
        alertBox.className = 'alert-error';
        alertBox.innerHTML = `❌ <b>Błąd logowania:</b> ${err.message}`;
      } finally {
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
